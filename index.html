<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>World Dai Star Player</title>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0a0a14;--surface:#13131e;--card:#1a1a2e;--accent:#4a90d9;
--gold:#ffd700;--text:#e8e8e8;--muted:#666;--border:#252535;
--blue:#4488ff;--green:#44dd44;--red:#ff4444;--purple:#cc44cc;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none}
#app{width:100%;height:100%;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}
/* Loading */
#screen-loading{align-items:center;justify-content:center;text-align:center}
.loading-logo{font-size:2rem;font-weight:700;margin-bottom:1rem;
background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;
-webkit-text-fill-color:transparent;background-clip:text}
.loading-sub{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem}
.loading-bar{width:200px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.loading-fill{width:0;height:100%;background:var(--accent);transition:width .3s}
.loading-err{color:var(--red);font-size:.85rem;margin-top:1rem;display:none}
/* Header */
.header{display:flex;align-items:center;padding:.6rem 1rem;gap:.5rem;
background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
/* 三栏布局：左右固定不收缩，中间可收缩并省略，保证标题永远不被按钮覆盖 */
.header-left,.header-right{display:flex;align-items:center;gap:.5rem;flex:0 0 auto;min-width:0}
.header-right{justify-content:flex-end}
.header-title{font-size:1.1rem;font-weight:700;flex:1 1 auto;min-width:0;
padding:0 .5rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:var(--card);border:1px solid var(--border);color:var(--text);
padding:.4rem .8rem;border-radius:6px;cursor:pointer;font-size:.85rem;transition:.15s}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn:active{transform:scale(.95)}
.btn-sm{padding:.25rem .5rem;font-size:.75rem}
#btn-fav{font-size:1.1rem;padding:.25rem .5rem}
#btn-fav.active{color:var(--gold);border-color:var(--gold);background:rgba(255,215,0,.1)}
/* Search */
.search-bar{padding:.5rem 1rem;background:var(--surface);border-bottom:1px solid var(--border)}
.search-bar input{width:100%;padding:.5rem .8rem;background:var(--card);border:1px solid var(--border);
border-radius:8px;color:var(--text);font-size:.9rem;outline:none}
.search-bar input:focus{border-color:var(--accent)}
/* Song List */
#song-list{flex:1;overflow-y:auto;padding:.6rem;display:grid;gap:.6rem;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.song-card{background:var(--card);border:1px solid var(--border);border-radius:10px;
overflow:hidden;cursor:pointer;transition:.2s;position:relative}
.song-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.song-cover-wrap{position:relative;min-height:80px;aspect-ratio:1;background:var(--surface);display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:10px 10px 0 0}
.song-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:var(--accent);background:var(--surface)}
.empty-hint{grid-column:1/-1;text-align:center;color:var(--muted);font-size:.85rem;line-height:1.7;padding:2rem 1rem}
.song-info{padding:.4rem .5rem}
.song-title{font-size:.78rem;font-weight:600;line-height:1.3;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.song-artist{font-size:.68rem;color:var(--muted);margin-top:.15rem;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-diffs{display:flex;flex-wrap:wrap;gap:.2rem;margin-top:.3rem}
.diff-badge{font-size:.58rem;padding:.1rem .35rem;border-radius:4px;font-weight:600}
.diff-Normal{background:#224466;color:#aaccff}
.diff-Hard{background:#446622;color:#ccffaa}
.diff-Extra{background:#664422;color:#ffdcaa}
.diff-Stella{background:#442266;color:#dabbff}
.diff-Olivier{background:#662244;color:#ffaabb}
/* Pagination */
.pagination{display:flex;justify-content:center;align-items:center;gap:.5rem;
padding:.6rem;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.page-info{font-size:.8rem;color:var(--muted)}
/* Detail */
#screen-detail{align-items:center;justify-content:flex-start;padding:1rem}
.detail-card{max-width:420px;width:100%;background:var(--card);border:1px solid var(--border);
border-radius:12px;overflow:visible}
.detail-cover{width:100%;aspect-ratio:1.2;object-fit:cover}
.detail-cover-wrap{position:relative}
.detail-fav{position:absolute;top:.5rem;right:.5rem;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);color:var(--gold);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;backdrop-filter:blur(4px)}
.detail-fav:hover{background:rgba(0,0,0,.7)}
.detail-fav.active{color:var(--gold);text-shadow:0 0 8px var(--gold)}
.detail-body{padding:1rem}
.detail-title{font-size:1.2rem;font-weight:700;margin-bottom:.2rem}
.detail-artist{color:var(--muted);font-size:.9rem;margin-bottom:1rem}
.detail-desc{font-size:.78rem;color:#999;line-height:1.5;margin-bottom:.8rem;
white-space:pre-line;max-height:120px;overflow-y:auto}
.diff-list{display:flex;flex-direction:column;gap:.4rem}
.diff-row{display:flex;align-items:center;justify-content:space-between;
padding:.5rem .8rem;background:var(--surface);border-radius:8px;cursor:pointer;transition:.15s}
.diff-row:hover{background:var(--accent)}
.diff-name{font-weight:600;font-size:.9rem}
.diff-rating{font-size:.8rem;color:var(--muted)}
/* Game */
#screen-game{position:relative;background:#000}
#game-canvas{display:block;width:100%;height:100%}
#game-hud{position:absolute;inset:0;pointer-events:none}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
padding:.6rem .8rem}
.hud-score{font-size:1.3rem;font-weight:700;color:#fff;text-shadow:0 0 8px rgba(0,0,0,.8)}
.hud-pause{pointer-events:auto;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);
border:1px solid rgba(255,255,255,.2);color:#fff;font-size:1rem;cursor:pointer;
display:flex;align-items:center;justify-content:center}
.hud-combo{position:absolute;top:35%;left:50%;transform:translateX(-50%);
font-size:2.5rem;font-weight:800;color:#fff;text-shadow:0 0 12px rgba(0,0,0,.8);text-align:center}
.hud-combo small{display:block;font-size:.9rem;font-weight:400;opacity:.7}
#game-loading{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;
align-items:center;justify-content:center;flex-direction:column;gap:.5rem}
.game-load-text{color:var(--text);font-size:.9rem}
.game-load-bar{width:160px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.game-load-fill{width:0;height:100%;background:var(--accent);transition:width .3s}
/* Results */
#screen-results{align-items:center;justify-content:center;padding:1rem}
.results-card{max-width:380px;width:100%;background:var(--card);border:1px solid var(--border);
border-radius:12px;padding:1.5rem;text-align:center}
.results-title{font-size:1.3rem;font-weight:700;margin-bottom:.2rem}
.results-artist{color:var(--muted);font-size:.85rem;margin-bottom:1rem}
.results-score{font-size:2.5rem;font-weight:800;color:var(--gold);margin-bottom:.2rem}
.results-rank{font-size:1.5rem;font-weight:700;margin-bottom:1rem}
.results-maxcombo{font-size:.9rem;color:var(--text);margin-bottom:1rem}
.results-judgments{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1.2rem}
.judge-item{background:var(--surface);padding:.5rem;border-radius:8px}
.judge-label{font-size:.75rem;color:var(--muted)}
.judge-value{font-size:1.1rem;font-weight:700}
.results-actions{display:flex;gap:.5rem}
.results-actions .btn{flex:1;padding:.6rem;font-size:.9rem}
/* Settings */
.settings-panel{position:fixed;bottom:0;left:0;right:0;background:var(--surface);
border-top:1px solid var(--border);padding:1rem;display:none;z-index:100;max-height:50vh;overflow-y:auto}
.settings-panel.active{display:block}
.setting-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.setting-label{font-size:.85rem}
.setting-value{font-size:.85rem;color:var(--accent);font-weight:600}
input[type=range]{width:60%}
/* Toggle switch */
.switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:24px;
transition:.2s}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;top:3px;
background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider:before{transform:translateX(20px)}
/* Pause modal */
#pause-modal{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;
align-items:center;justify-content:center;z-index:50}
#pause-modal.active{display:flex}
.pause-card{width:240px;background:var(--card);border:1px solid var(--border);
border-radius:12px;padding:1.2rem;display:flex;flex-direction:column;gap:.6rem}
.pause-title{font-size:1.2rem;font-weight:700;text-align:center;margin-bottom:.4rem}
.btn-pause-action{padding:.6rem;font-size:.95rem}
/* News */
#screen-news{background:var(--bg)}
.news-toolbar{padding:.5rem 1rem;background:var(--surface);border-bottom:1px solid var(--border);
display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;flex-shrink:0}
.news-toolbar .field{display:flex;align-items:center;gap:.3rem}
.news-toolbar label{font-size:.72rem;color:var(--muted);white-space:nowrap}
.news-toolbar select,.news-toolbar input{background:var(--card);border:1px solid var(--border);
color:var(--text);border-radius:6px;padding:.3rem .4rem;font-size:.75rem;outline:none}
.news-toolbar input{flex:1;min-width:110px}
.news-toolbar select:focus,.news-toolbar input:focus{border-color:var(--accent)}
#news-list{flex:1;overflow-y:auto;padding:.6rem;display:flex;flex-direction:column;gap:.5rem}
.news-card{background:var(--card);border:1px solid var(--border);border-radius:10px;
padding:.55rem .7rem;cursor:pointer;transition:.15s}
.news-card:hover{border-color:var(--accent)}
.news-card:active{transform:scale(.99)}
.news-card-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.25rem}
.news-date{font-size:.75rem;font-weight:700;color:var(--gold);white-space:nowrap}
.news-cat{font-size:.68rem;color:var(--muted)}
.news-imp{margin-left:auto;font-size:.68rem;font-weight:700;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.imp-高{background:#442222;color:#ffaaaa}.imp-中{background:#444422;color:#ffffaa}.imp-低{background:#222244;color:#aaaaff}
.news-title{font-size:.85rem;font-weight:600;line-height:1.35}
.news-tag{display:inline-block;font-size:.65rem;background:var(--surface);color:var(--accent);
padding:.1rem .4rem;border-radius:4px;margin-right:.3rem;margin-top:.3rem}
/* News Modal */
#news-modal{position:absolute;inset:0;background:rgba(5,5,10,.94);display:none;z-index:80;
flex-direction:column}
#news-modal.active{display:flex}
#news-modal .nm-header{display:flex;align-items:center;gap:.5rem;padding:.6rem 1rem;
background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
#news-modal .nm-date{font-size:.8rem;font-weight:700;color:var(--gold)}
#news-modal .nm-body{flex:1;overflow-y:auto;padding:1.2rem 1rem;max-width:560px;width:100%;margin:0 auto}
#news-modal .nm-title{font-size:1.25rem;font-weight:700;line-height:1.4;margin:.5rem 0 .9rem}
#news-modal .nm-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
#news-modal .nm-tags span{font-size:.72rem;background:var(--surface);color:var(--accent);
padding:.2rem .55rem;border-radius:12px;border:1px solid var(--border)}
#news-modal .nm-text{font-size:.9rem;line-height:1.75;color:#ddd;white-space:pre-wrap}
#news-modal .nm-kv{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:.8rem 0}
#news-modal .nm-kv div{display:flex;border-bottom:1px solid rgba(37,37,53,.7);font-size:.85rem;padding:.5rem .7rem}
#news-modal .nm-kv div:last-child{border-bottom:0}
#news-modal .nm-kv b{color:var(--gold);width:105px;flex-shrink:0}
#news-modal .nm-source{margin-top:1rem;padding-top:.7rem;border-top:1px dashed var(--border);
font-size:.75rem;color:var(--muted)}
/* Responsive */
@media(max-width:380px){#song-list{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){
.header-left,.header-right{gap:.3rem}
.header-right .btn{padding:.25rem .4rem;font-size:.7rem;flex:0 0 auto}
.header-left .btn{padding:.25rem .4rem;font-size:.7rem;flex:0 0 auto}
.header-title{font-size:.85rem;padding:0 .35rem}
}
</style>
</head>

<script>
// ===== Config =====
const SERVER='https://wds.server.littleyang.com.cn';
const CORS_PROXIES=[
'https://corsproxy.io/?url=',
'https://api.allorigins.win/raw?url=',
'https://thingproxy.freeboard.io/fetch/',
'https://api.codetabs.com/v1/proxy?quest=',
'https://cors-anywhere.herokuapp.com/'
];
// FIX: settings 合并（原写法 Object.assign 结果丢了）
const settings=Object.assign({noteSpeed:400,audioOffset:0,laneCover:30,autoPlay:false},JSON.parse(localStorage.getItem('wds-settings')||'{}'));
// ===== Utils =====
function fixUrl(u){if(!u)return '';u=u.replace(/^http:/,'https:');if(u.startsWith('/'))u=SERVER+u;return u}
function $(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function fetchWithFallback(url, timeout=6000){
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(), timeout);
try{
const r=await fetch(url,{signal:controller.signal});
clearTimeout(timer);
if(r.ok)return r;
}catch(e){clearTimeout(timer)}
return fetchCORS(url);
}
async function fetchCORS(url){
let lastErr=null;
for(let i=0;i<CORS_PROXIES.length;i++){
const p=CORS_PROXIES[i];
try{
const pu=p+encodeURIComponent(url);
const r=await fetch(pu,{signal:AbortSignal.timeout(5000)});
if(r.ok)return r;
}catch(e){lastErr=e;console.warn(`Proxy ${i} failed:`,e.message)}
}
throw new Error('All proxies failed. Server may be unreachable.');
}
async function decompressGzip(buf){
// Try plain JSON first (proxy may have decompressed)
try{
const text=new TextDecoder().decode(buf);
if(text.startsWith('{'))return new Uint8Array(buf);
}catch(e){}
// Try gzip decompression
if(typeof DecompressionStream!=='undefined'){
try{
const ds=new DecompressionStream('gzip');
const stream=new Blob([buf]).stream().pipeThrough(ds);
return new Uint8Array(await new Response(stream).arrayBuffer());
}catch(e){}
}
if(typeof pako!=='undefined')return pako.ungzip(buf);
throw new Error('No gzip decompressor available');
}
// ===== Chart Parser =====
function parseChart(json){
const{bgmOffset,entities}=json;
const getData=(e,n)=>{const d=e.data.find(x=>x.name===n);return d?d.value:null};
const bpmChanges=entities.filter(e=>e.archetype==='#BPM_CHANGE')
.map(e=>({beat:getData(e,'#BEAT')||0,bpm:getData(e,'#BPM')||60}))
.sort((a,b)=>a.beat-b.beat);
if(bpmChanges.length===0)bpmChanges.push({beat:0,bpm:60});
function beatToTime(beat){
let t=0,pb=0,pbpm=bpmChanges[0].bpm;
for(let i=0;i<bpmChanges.length;i++){
const{beat:cb,bpm}=bpmChanges[i];
if(beat<=cb+1e-9){t+=(beat-pb)*60/pbpm;return t}
t+=(cb-pb)*60/pbpm;pb=cb;pbpm=bpm
}
t+=(beat-pb)*60/pbpm;return t
}
const notes=[];
const holds=[];
const splitLines=[];
const syncLines=[];
const holdStarts=[];
for(const e of entities){
const a=e.archetype;
const beat=getData(e,'beat');
const lane=getData(e,'lane');
const laneLength=getData(e,'laneLength')||1;
if(a==='Sirius Normal Note'||a==='Sirius Critical Note'){
notes.push({type:'tap',beat,lane,laneLength:laneLength,
critical:a.includes('Critical'),time:beatToTime(beat),judged:false});
}else if(a==='Sirius Flick Note'){
notes.push({type:'flick',beat,lane,laneLength:laneLength,
critical:false,time:beatToTime(beat),judged:false});
}else if(a==='Sirius Hold Start'||a==='Sirius Critical Hold Start'){
holdStarts.push({type:'holdStart',beat,lane,laneLength:laneLength,
critical:a.includes('Critical'),time:beatToTime(beat)});
}else if(a==='Sirius Hold End'){
const stBeat=getData(e,'stBeat');
const st=holdStarts.find(s=>Math.abs(s.beat-stBeat)<1e-6&&s.lane===lane);
if(st){
notes.push({type:'hold',beat:st.beat,lane,laneLength:laneLength,
critical:st.critical,time:st.time,endTime:beatToTime(beat),judged:false,
holdActive:false,startJudged:false});
}
}else if(a==='Sirius Scratch Hold Start'||a==='Sirius Critical Scratch Hold Start'){
holdStarts.push({type:'scratchStart',beat,lane,laneLength:laneLength,
critical:a.includes('Critical'),time:beatToTime(beat),isScratch:true});
}else if(a==='Sirius Scratch Hold End'){
const stBeat=getData(e,'stBeat');
const scratchLength=getData(e,'scratchLength')||0;
const st=holdStarts.find(s=>Math.abs(s.beat-stBeat)<1e-6&&s.lane===lane);
if(st){
notes.push({type:'scratchHold',beat:st.beat,lane,laneLength:laneLength,
critical:st.critical,time:st.time,endTime:beatToTime(beat),judged:false,
holdActive:false,startJudged:false,scratchLength});
}
}else if(a==='Sirius Split Line'){
const endBeat=getData(e,'endBeat')||beat;
const color=getData(e,'color')||0;
splitLines.push({beat,endBeat,color,time:beatToTime(beat)});
}else if(a==='Sirius Sync Line'){
const left=getData(e,'left');
const right=getData(e,'right');
syncLines.push({beat,left,right,time:beatToTime(beat)});
}
}
notes.sort((a,b)=>a.time-b.time);
return{bgmOffset,bpmChanges,notes,splitLines,syncLines,beatToTime};
}
// ===== Game Engine =====
class Game{
constructor(canvas,chart,bgmUrl,bgUrl){
this.canvas=canvas;
this.ctx=canvas.getContext('2d');
this.chart=chart;
this.bgmUrl=bgmUrl;
this.bgUrl=bgUrl;
this.notes=chart.notes.map(n=>({...n}));
this.splitLines=chart.splitLines;
this.syncLines=chart.syncLines;
this.bgmOffset=chart.bgmOffset;
this.score=0;
this.combo=0;
this.maxCombo=0;
this.judgments={perfect:0,great:0,good:0,miss:0};
this.totalNotes=this.notes.length;
this.totalJudgable=this.notes.length;
this.audio=new Audio();
this.bgImg=null;
this.running=false;
this.paused=false;
this.startTime=0;
this.judgeWindows={perfect:0.05,great:0.1,good:0.15};
this.lanePressed=[false,false,false,false];
this.judgeText='';
this.judgeColor='';
this.judgeTime=0;
this.activeHolds=[];
this.particles=[];
this.level=null;
}
async init(){
this.audio.src=this.bgmUrl;
await new Promise((res,rej)=>{
this.audio.addEventListener('canplay',res,{once:true});
this.audio.addEventListener('error',rej,{once:true});
setTimeout(()=>res(),5000);
});
if(this.bgUrl){
this.bgImg=new Image();
this.bgImg.src=this.bgUrl;
}
this.resize();
window.addEventListener('resize',()=>this.resize());
}
resize(){
const dpr=window.devicePixelRatio||1;
const w=this.canvas.parentElement.clientWidth;
const h=this.canvas.parentElement.clientHeight;
this.cw=w;this.ch=h;
this.canvas.width=w*dpr;
this.canvas.height=h*dpr;
this.canvas.style.width=w+'px';
this.canvas.style.height=h+'px';
this.ctx.setTransform(dpr,0,0,dpr,0,0);
this.judgeY=h-80;
this.laneW=w/4;
this.noteH=Math.max(14,Math.min(22,h/30));
}
start(){
this.audio.play().catch(()=>{});
this.running=true;
this.loop();
}
getTime(){
return this.audio.currentTime+settings.audioOffset/1000+this.bgmOffset;
}
loop(){
if(!this.running)return;
if(!this.paused){
this.update();
this.render();
}
requestAnimationFrame(()=>this.loop());
}
update(){
const t=this.getTime();
if(settings.autoPlay){
for(const n of this.notes){
if(n.judged)continue;
if(t>=n.time){
if(n.type==='hold'||n.type==='scratchHold'){
if(!n.startJudged){
n.startJudged=true;
n.holdActive=true;
this.activeHolds.push(n);
this.score+=this.scorePerNote('perfect')*0.5;
this.judgments.perfect++;
this.combo++;
this.showJudge('PERFECT','#ffd700');
this.spawnParticles(Math.floor((n.lane-1)/3));
}
}else{
n.judged=true;
this.score+=this.scorePerNote('perfect');
this.judgments.perfect++;
this.combo++;
if(this.combo>this.maxCombo)this.maxCombo=this.combo;
this.showJudge('PERFECT','#ffd700');
this.spawnParticles(Math.floor((n.lane-1)/3));
}
}
}
}
for(const n of this.notes){
if(n.judged)continue;
if((n.type==='hold'||n.type==='scratchHold')&&n.startJudged)continue;
if(t-n.time>this.judgeWindows.good){
n.judged=true;
this.combo=0;
this.judgments.miss++;
this.showJudge('MISS','#ff4444');
if(n.type==='hold'||n.type==='scratchHold'){
this.activeHolds=this.activeHolds.filter(h=>h!==n);
}
}
}
for(const h of this.activeHolds){
if(t>=h.endTime){
if(h.holdActive){
this.score+=this.scorePerNote('perfect');
this.judgments.perfect++;
this.combo++;
this.showJudge('PERFECT','#ffd700');
}else{
this.score+=this.scorePerNote('good');
this.judgments.good++;
this.combo++;
this.showJudge('GOOD','#44dd44');
}
h.judged=true;
if(this.combo>this.maxCombo)this.maxCombo=this.combo;
}
}
this.activeHolds=this.activeHolds.filter(h=>!h.judged);
this.particles=this.particles.filter(p=>{
p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life--;
return p.life>0;
});
if(this.audio.ended&&this.running){
this.running=false;
setTimeout(()=>this.end(),500);
}
}
scorePerNote(type){
const per=this.totalJudgable>0?1000000/this.totalJudgable:0;
if(type==='perfect')return per;
if(type==='great')return per*0.7;
if(type==='good')return per*0.4;
return 0;
}
noteInZone(n,lane){
const sz=Math.floor((n.lane-1)/3);
const ez=Math.floor((n.lane+n.laneLength-2)/3);
return lane>=sz&&lane<=ez;
}
handleLaneDown(lane){
this.lanePressed[lane]=true;
const t=this.getTime();
let best=null,bestDt=Infinity;
for(const n of this.notes){
if(n.judged)continue;
if(!this.noteInZone(n,lane))continue;
if(n.type==='hold'||n.type==='scratchHold'){
if(n.startJudged)continue;
}
const dt=Math.abs(n.time-t);
if(dt<this.judgeWindows.good&&dt<bestDt){
best=n;bestDt=dt;
}
}
if(best){
this.judgeNote(best,bestDt,lane);
}
}
handleLaneUp(lane){
this.lanePressed[lane]=false;
for(const h of this.activeHolds){
if(this.noteInZone(h,lane)){
h.holdActive=false;
}
}
}
judgeNote(n,dt,lane){
if(n.type==='hold'||n.type==='scratchHold'){
n.startJudged=true;
n.holdActive=true;
this.activeHolds.push(n);
if(dt<this.judgeWindows.perfect){
this.score+=this.scorePerNote('perfect')*0.5;
this.judgments.perfect++;
this.combo++;
this.showJudge('PERFECT','#ffd700');
}else if(dt<this.judgeWindows.great){
this.score+=this.scorePerNote('great')*0.5;
this.judgments.great++;
this.combo++;
this.showJudge('GREAT','#4488ff');
}else{
this.score+=this.scorePerNote('good')*0.5;
this.judgments.good++;
this.combo++;
this.showJudge('GOOD','#44dd44');
}
this.spawnParticles(lane);
}else{
n.judged=true;
let type,color;
if(dt<this.judgeWindows.perfect){
type='perfect';color='#ffd700';
}else if(dt<this.judgeWindows.great){
type='great';color='#4488ff';
}else{
type='good';color='#44dd44';
}
this.score+=this.scorePerNote(type);
this.judgments[type]++;
this.combo++;
if(this.combo>this.maxCombo)this.maxCombo=this.combo;
this.showJudge(type.toUpperCase(),color);
this.spawnParticles(lane);
}
}
showJudge(text,color){
this.judgeText=text;
this.judgeColor=color;
this.judgeTime=performance.now();
}
spawnParticles(lane){
const cx=lane*this.laneW+this.laneW/2;
const cy=this.judgeY;
for(let i=0;i<6;i++){
this.particles.push({
x:cx,y:cy,
vx:(Math.random()-0.5)*4,
vy:(Math.random()-0.8)*4,
life:20+Math.random()*10,
color:Math.random()>0.5?'#ffd700':'#4488ff'
});
}
}
noteY(time){
return this.judgeY-(time-this.getTime())*settings.noteSpeed;
}
render(){
const ctx=this.ctx;
const w=this.cw,h=this.ch;
ctx.fillStyle='#000';
ctx.fillRect(0,0,w,h);
if(this.bgImg&&this.bgImg.complete&&this.bgImg.naturalWidth>0){
const iw=this.bgImg.naturalWidth,ih=this.bgImg.naturalHeight;
const sc=Math.max(w/iw,h/ih);
const dw=iw*sc,dh=ih*sc;
ctx.drawImage(this.bgImg,(w-dw)/2,(h-dh)/2,dw,dh);
ctx.fillStyle='rgba(0,0,0,0.5)';
ctx.fillRect(0,0,w,h);
}
for(let i=0;i<4;i++){
const x=i*this.laneW;
ctx.fillStyle='rgba(20,20,35,0.4)';
ctx.fillRect(x,0,this.laneW,h);
ctx.strokeStyle='rgba(255,255,255,0.08)';
ctx.lineWidth=1;
ctx.beginPath();
ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
}
ctx.beginPath();
ctx.moveTo(w,0);ctx.lineTo(w,h);ctx.stroke();
for(const sl of this.splitLines){
const y=this.noteY(sl.time);
if(y>-50&&y<h+50){
ctx.strokeStyle='rgba(255,255,255,0.15)';
ctx.lineWidth=1;
ctx.beginPath();
ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
}
}
for(const sl of this.syncLines){
const y=this.noteY(sl.time);
if(y>-50&&y<h+50){
const x1=((sl.left||1)-1)/12*w;
const x2=((sl.right||12)-1)/12*w+this.laneW;
ctx.strokeStyle='rgba(100,100,200,0.2)';
ctx.lineWidth=1;
ctx.beginPath();
ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();
}
}
for(const n of this.notes){
if(n.judged&&n.type!=='hold'&&n.type!=='scratchHold')continue;
if(n.type==='hold'||n.type==='scratchHold'){
if(n.judged)continue;
const sy=this.noteY(n.time);
const ey=this.noteY(n.endTime);
if(ey<-50||sy>h+50)continue;
this.drawHold(n,sy,ey);
}else{
const y=this.noteY(n.time);
if(y<-50||y>h+50)continue;
if(n.judged)continue;
this.drawNote(n,y);
}
}
ctx.strokeStyle='rgba(255,255,255,0.3)';
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(0,this.judgeY);ctx.lineTo(w,this.judgeY);ctx.stroke();
for(let i=0;i<4;i++){
const x=i*this.laneW;
ctx.fillStyle=this.lanePressed[i]?'rgba(74,144,217,0.3)':'rgba(255,255,255,0.05)';
ctx.fillRect(x,this.judgeY-5,this.laneW,10);
}
if(settings.laneCover>0){
const ch2=h*settings.laneCover/100;
const grad=ctx.createLinearGradient(0,h-ch2,0,h);
grad.addColorStop(0,'rgba(0,0,0,0)');
grad.addColorStop(1,'rgba(0,0,0,0.85)');
ctx.fillStyle=grad;
ctx.fillRect(0,h-ch2,w,ch2);
}
for(const p of this.particles){
ctx.fillStyle=p.color;
ctx.globalAlpha=p.life/30;
ctx.beginPath();
ctx.arc(p.x,p.y,3,0,Math.PI*2);
ctx.fill();
}
ctx.globalAlpha=1;
const elapsed=performance.now()-this.judgeTime;
if(elapsed<600&&this.judgeText){
const a=1-elapsed/600;
const scale=1+0.3*Math.sin(Math.min(elapsed/300,1)*Math.PI*0.5);
ctx.save();
ctx.globalAlpha=a;
ctx.font=`bold ${20*scale}px sans-serif`;
ctx.fillStyle=this.judgeColor;
ctx.textAlign='center';
ctx.fillText(this.judgeText,w/2,h*0.55);
ctx.restore();
}
$('hud-score').textContent=Math.floor(this.score).toLocaleString();
if(this.combo>0){
$('hud-combo').style.display='';
$('combo-num').textContent=this.combo;
}else{
$('hud-combo').style.display='none';
}
}
drawNote(n,y){
const ctx=this.ctx;
const x=((n.lane-1)/12)*this.cw;
const nw=(n.laneLength/12)*this.cw;
let color='#4488ff';
if(n.critical)color='#ffd700';
if(n.type==='flick')color='#44dd44';
ctx.shadowBlur=n.critical?15:8;
ctx.shadowColor=color;
ctx.fillStyle=color;
this.roundRect(x+2,y-this.noteH/2,nw-4,this.noteH,6);
ctx.fill();
ctx.shadowBlur=0;
ctx.fillStyle='rgba(255,255,255,0.3)';
this.roundRect(x+4,y-this.noteH/2+2,nw-8,3,3);
ctx.fill();
if(n.type==='flick'){
ctx.fillStyle='#fff';
ctx.font='12px sans-serif';
ctx.textAlign='center';
ctx.fillText('>',x+nw/2,y+4);
}
}
drawHold(n,sy,ey){
const ctx=this.ctx;
const x=((n.lane-1)/12)*this.cw;
const nw=(n.laneLength/12)*this.cw;
let color='#4488ff';
if(n.critical)color='#ffd700';
if(n.type==='scratchHold')color='#cc44cc';
const topY=Math.min(sy,ey);
const botY=Math.max(sy,ey);
ctx.fillStyle=color+'66';
ctx.fillRect(x+4,topY,nw-8,botY-topY);
ctx.strokeStyle=color;
ctx.lineWidth=2;
ctx.strokeRect(x+4,topY,nw-8,botY-topY);
if(!n.startJudged){
ctx.shadowBlur=8;
ctx.shadowColor=color;
ctx.fillStyle=color;
this.roundRect(x+2,sy-this.noteH/2,nw-4,this.noteH,6);
ctx.fill();
ctx.shadowBlur=0;
}
ctx.fillStyle=color+'aa';
this.roundRect(x+2,ey-this.noteH/2,nw-4,this.noteH,6);
ctx.fill();
}
roundRect(x,y,w,h,r){
const ctx=this.ctx;
ctx.beginPath();
ctx.moveTo(x+r,y);
ctx.lineTo(x+w-r,y);
ctx.quadraticCurveTo(x+w,y,x+w,y+r);
ctx.lineTo(x+w,y+h-r);
ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
ctx.lineTo(x+r,y+h);
ctx.quadraticCurveTo(x,y+h,x,y+h-r);
ctx.lineTo(x,y+r);
ctx.quadraticCurveTo(x,y,x+r,y);
ctx.closePath();
}
pause(){
this.paused=true;
this.audio.pause();
}
resume(){
this.paused=false;
this.audio.play().catch(()=>{});
}
end(){
this.running=false;
this.audio.pause();
showResults(this);
}
}

async function startGame(level){
showScreen('screen-game');
$('game-loading').style.display='flex';
$('game-load-text').textContent='Loading chart...';
$('game-load-fill').style.width='20%';
try{
$('game-load-text').textContent='Downloading chart data...';
const resp=await fetchCORS(level.data.url);
$('game-load-fill').style.width='50%';
const buf=await resp.arrayBuffer();
$('game-load-text').textContent='Decompressing...';
const decompressed=await decompressGzip(new Uint8Array(buf));
$('game-load-fill').style.width='70%';
const json=JSON.parse(new TextDecoder().decode(decompressed));
const chart=parseChart(json);
$('game-load-text').textContent='Loading audio...';
$('game-load-fill').style.width='85%';
let bgUrl=null;
if(level.useBackground&&level.useBackground.item){
if(level.useBackground.item.image)bgUrl=level.useBackground.item.image.url;
else if(level.useBackground.item.thumbnail)bgUrl=level.useBackground.item.thumbnail.url;
}
const canvas=$('game-canvas');
currentGame=new Game(canvas,chart,level.bgm.url,bgUrl);
currentGame.level=level;
await currentGame.init();
$('game-load-fill').style.width='100%';
$('game-loading').style.display='none';
currentGame.start();
}catch(e){
$('game-load-text').textContent='Error: '+e.message;
$('game-load-fill').style.width='0%';
setTimeout(()=>{showScreen('screen-detail');$('game-loading').style.display='flex'},2000);
}
}
function showResults(game){
const c=$('results-content');
const s=Math.floor(game.score);
const fc=game.judgments.perfect+game.judgments.great===game.totalJudgable&&game.judgments.miss===0;
let rank='C';
const pct=game.totalJudgable>0?s/1000000:0;
if(pct>=0.95)rank='SSS';
else if(pct>=0.9)rank='SS';
else if(pct>=0.8)rank='S';
else if(pct>=0.7)rank='A';
else if(pct>=0.6)rank='B';
else if(pct>=0.5)rank='C';
else rank='D';
if(fc)rank+=' (FC)';
const lv=selectedSong?selectedSong.difficulties[0]:null;
const t=lv?(lv.tags&&lv.tags[0]&&lv.tags[0].title)||'':'';
c.innerHTML=`
<div class="results-card">
<div class="results-title">${esc(lv?lv.title:'')}</div>
<div class="results-artist">${esc(lv?lv.artists||'':'')} ${t?'- '+t:''}</div>
<div class="results-score">${s.toLocaleString()}</div>
<div class="results-rank">${rank}</div>
<div class="results-maxcombo">Max Combo: ${game.maxCombo}</div>
<div class="results-judgments">
<div class="judge-item"><div class="judge-label">Perfect</div><div class="judge-value" style="color:#ffd700">${game.judgments.perfect}</div></div>
<div class="judge-item"><div class="judge-label">Great</div><div class="judge-value" style="color:#4488ff">${game.judgments.great}</div></div>
<div class="judge-item"><div class="judge-label">Good</div><div class="judge-value" style="color:#44dd44">${game.judgments.good}</div></div>
<div class="judge-item"><div class="judge-label">Miss</div><div class="judge-value" style="color:#ff4444">${game.judgments.miss}</div></div>
</div>
<div class="results-actions">
<button class="btn" id="btn-retry">Retry</button>
<button class="btn" id="btn-back-songs">Song List</button>
</div>
</div>
`;
$('btn-retry').onclick=()=>{

startGame(cur);
}
};
$('btn-back-songs').onclick=()=>{
showScreen('screen-songs');
};
showScreen('screen-results');
}

const KEY_MAP={'d':0,'f':1,'j':2,'k':3,'1':0,'2':1,'3':2,'4':3,
'a':0,'s':1,'l':2,';':3};
document.addEventListener('keydown',e=>{
if($('screen-game').classList.contains('active')&&currentGame&&!currentGame.paused){
const lane=KEY_MAP[e.key.toLowerCase()];
if(lane!==undefined&&!e.repeat){
e.preventDefault();
currentGame.handleLaneDown(lane);
}
}
if(e.key==='Escape'){
if(currentGame&&currentGame.running){
if(currentGame.paused)currentGame.resume();
else currentGame.pause();
}
}
});
document.addEventListener('keyup',e=>{
if($('screen-game').classList.contains('active')&&currentGame&&!currentGame.paused){
const lane=KEY_MAP[e.key.toLowerCase()];
if(lane!==undefined){
e.preventDefault();
currentGame.handleLaneUp(lane);
}
}
});
const canvas=$('game-canvas');
function getLaneFromEvent(e){
const rect=canvas.getBoundingClientRect();
const x=(e.clientX||(e.touches&&e.touches[0]&&e.touches[0].clientX)||0)-rect.left;
return Math.max(0,Math.min(3,Math.floor(x/rect.width*4)));
}
canvas.addEventListener('touchstart',e=>{
e.preventDefault();
if(currentGame&&!currentGame.paused){
for(const t of e.changedTouches){
const rect=canvas.getBoundingClientRect();
const x=t.clientX-rect.left;
const lane=Math.max(0,Math.min(3,Math.floor(x/rect.width*4)));
currentGame.handleLaneDown(lane);
}
}
},{passive:false});
canvas.addEventListener('touchend',e=>{
e.preventDefault();
if(currentGame&&!currentGame.paused){
for(const t of e.changedTouches){
const rect=canvas.getBoundingClientRect();
const x=t.clientX-rect.left;
const lane=Math.max(0,Math.min(3,Math.floor(x/rect.width*4)));
currentGame.handleLaneUp(lane);
}
}
},{passive:false});
canvas.addEventListener('mousedown',e=>{
if(currentGame&&!currentGame.paused){
const lane=getLaneFromEvent(e);
currentGame.handleLaneDown(lane);
}
});
canvas.addEventListener('mouseup',e=>{
if(currentGame&&!currentGame.paused){
const lane=getLaneFromEvent(e);
currentGame.handleLaneUp(lane);
}
});

let newsPage=0,newsPerPage=12,newsFiltered=[];
const fmtDate=d=>d.replace(/-/g,".");
(function initNews(){
const catSel=$('news-cat');
[...new Set(NEWS_DATA.map(n=>n.cat))].forEach(c=>{
const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o);
});
bindNewsEvents();
renderNews();
})();
function bindNewsEvents(){
$('btn-news').onclick=()=>{renderNews();showScreen('screen-news')};
$('btn-back-songs2').onclick=()=>showScreen('screen-songs');
$('news-search').oninput=()=>{newsPage=0;renderNews()};
$('news-cat').onchange=()=>{newsPage=0;renderNews()};
$('news-imp').onchange=()=>{newsPage=0;renderNews()};
$('news-sort').onchange=()=>{newsPage=0;renderNews()};
$('btn-reset-news').onclick=()=>{
$('news-search').value='';$('news-cat').value='';$('news-imp').value='';$('news-sort').value='desc';
newsPage=0;renderNews();
};
$('news-prev').onclick=()=>{if(newsPage>0){newsPage--;renderNews()}};
$('news-next').onclick=()=>{
if((newsPage+1)*newsPerPage<newsFiltered.length){newsPage++;renderNews()}
};
$('news-modal-close').onclick=closeNewsModal;
$('news-modal').addEventListener('click',e=>{if(e.target===$('news-modal'))closeNewsModal()});
}
function renderNews(){
const q=($('news-search').value||'').toLowerCase();
const cat=$('news-cat').value,imp=$('news-imp').value,sort=$('news-sort').value;
newsFiltered=NEWS_DATA.filter(n=>{
const hay=(n.title+n.text+n.cat+n.src).toLowerCase();
return (!q||hay.includes(q))&&(!cat||n.cat===cat)&&(!imp||n.imp===imp);
});
newsFiltered.sort((a,b)=>sort==='asc'?a.date.localeCompare(b.date):b.date.localeCompare(a.date));
const total=Math.max(1,Math.ceil(newsFiltered.length/newsPerPage));
if(newsPage>=total)newsPage=total-1;
const slice=newsFiltered.slice(newsPage*newsPerPage,(newsPage+1)*newsPerPage);
$('news-list').innerHTML=slice.map(n=>`
<div class="news-card" data-d="${n.date}" data-t="${esc(n.title)}">
<div class="news-card-top">
<span class="news-date">${fmtDate(n.date)}</span>
<span class="news-cat">${esc(n.cat)}</span>
<span class="news-imp imp-${n.imp}">${n.imp}</span>
</div>
<div class="news-title">${esc(n.title)}</div>
<span class="news-tag">${esc(n.src)}</span>
</div>`).join('')||'<div class="news-card"><div class="news-title">No news matches.</div></div>';
$('news-page').textContent=`${newsPage+1} / ${total}`;
$('news-list').querySelectorAll('.news-card[data-d]').forEach(c=>{
c.onclick=()=>openNewsModal(c.dataset.d,c.dataset.t);
});
}
function openNewsModal(date,title){
const n=NEWS_DATA.find(x=>x.date===date&&x.title===title);
if(!n)return;
$('nm-title-short').textContent=fmtDate(n.date);
let html=`<div class="nm-date">${fmtDate(n.date)}</div><div class="nm-title">${esc(n.title)}</div>
<div class="nm-tags"><span>${esc(n.cat)}</span><span>${esc(n.src)}</span><span>重要度：${n.imp}</span></div>
<div class="nm-text">${esc(n.text)}</div>`;
if(n.kv&&n.kv.length){
html+=`<div class="nm-kv">${n.kv.map(([k,v])=>`<div><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</div>`;
}
html+=`<div class="nm-source">掲載日：${fmtDate(n.date)}／分類：${esc(n.cat)}／情報源：${esc(n.src)}</div>`;
$('nm-body').innerHTML=html;
$('news-modal').classList.add('active');
}
function closeNewsModal(){$('news-modal').classList.remove('active')}
// ===== Init =====
loadFavorites();
updateFavBtn();
loadLevels(0);
</script>
